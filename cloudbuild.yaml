steps:
  # 1️⃣ Executa o Trivy (Apenas para Vulnerabilidades de Bibliotecas)
  - name: 'aquasec/trivy:0.50.1'
    id: 'Scan-Trivy'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "🔍 Iniciando varredura de dependências com Trivy..."
        trivy fs --format json \
                 --output /workspace/trivy-results.json \
                 --severity MEDIUM,HIGH,CRITICAL \
                 --scanners vuln \
                 --no-progress \
                 . || true

  # 2️⃣ Executa o Gitleaks (Especialista em Segredos)
  - name: 'zricethezav/gitleaks:latest'
    id: 'Scan-Gitleaks'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "🔍 Iniciando varredura de segredos com Gitleaks..."
        gitleaks detect --source . --report-format json --report-path /workspace/gitleaks-results.json --no-git || true

  # 3️⃣ Avalia, Mescla os resultados e Publica no Pub/Sub
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Avalia-e-Notifica'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "📊 Consolidando os resultados das varreduras..."
        
        cat << 'EOF' > /workspace/merge.py
        import json, os
        trivy_data = {"Results": []}
        
        if os.path.exists("/workspace/trivy-results.json"):
            try:
                with open("/workspace/trivy-results.json") as f:
                    data = json.load(f)
                    if data and "Results" in data:
                        trivy_data["Results"] = data["Results"]
            except: pass
            
        if os.path.exists("/workspace/gitleaks-results.json"):
            try:
                with open("/workspace/gitleaks-results.json") as f:
                    gl_data = json.load(f)
                    if isinstance(gl_data, list):
                        for leak in gl_data:
                            trivy_data["Results"].append({
                                "Target": leak.get("File", "Unknown"),
                                "Secrets": [{
                                    "Title": f"{leak.get('Description', 'Segredo')} encontrado na linha {leak.get('StartLine')}",
                                    "Severity": "CRITICAL"
                                }]
                            })
            except Exception as e:
                print(f"DEBUG: Erro ao ler Gitleaks JSON: {e}")
        
        has_vulns = any(len(r.get("Vulnerabilities", [])) > 0 or len(r.get("Secrets", [])) > 0 for r in trivy_data["Results"])
        
        # Aqui está o truque ninja: o Python salva a resposta num arquivo txt
        with open("/workspace/status.txt", "w") as f_status:
            if has_vulns:
                with open("/workspace/final_payload.json", "w") as f:
                    json.dump(trivy_data, f)
                f_status.write("FAILED")
            else:
                f_status.write("OK")
        EOF

        # Executa o script silenciosamente
        python3 /workspace/merge.py
        
        # O Bash lê o arquivo. Adeus variáveis com $, adeus erro de substituição!
        if grep -q "FAILED" /workspace/status.txt; then
          echo "⚠️ Problemas de segurança encontrados!"
          gcloud pubsub topics publish vulnerability-found --message="$(cat /workspace/final_payload.json)"
          echo "🚀 Relatório unificado enviado ao Pub/Sub com sucesso!"
        else
          echo "✅ Código limpo!"
        fi

options:
  logging: CLOUD_LOGGING_ONLY
